x2="1080" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="1120" y1="0" x2="1120" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="1160" y1="0" x2="1160" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="1200" y1="0" x2="1200" y2="470" stroke="#cdd4dc" stroke-width="1.4"/><line x1="1240" y1="0" x2="1240" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="1280" y1="0" x2="1280" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="1320" y1="0" x2="1320" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="1360" y1="0" x2="1360" y2="470" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="40" x2="1400" y2="40" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="80" x2="1400" y2="80" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="120" x2="1400" y2="120" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="160" x2="1400" y2="160" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="200" x2="1400" y2="200" stroke="#cdd4dc" stroke-width="1.4"/><line x1="0" y1="240" x2="1400" y2="240" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="280" x2="1400" y2="280" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="320" x2="1400" y2="320" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="360" x2="1400" y2="360" stroke="#cdd4dc" stroke-width="0.7"/><line x1="0" y1="400" x2="1400" y2="400" stroke="#cdd4dc" stroke-width="1.4"/><line x1="0" y1="440" x2="1400" y2="440" stroke="#cdd4dc" stroke-width="0.7"/><text x="40.0" y="52.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="#1f2937" text-anchor="start" font-weight="700">Soldering a wire to a test pad</text><text x="40.0" y="78.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#4b5563" text-anchor="start">The same four moves for GND1, the switched point and the button pad.</text><clipPath id="p1"><rect x="40" y="104" width="316" height="250" rx="16"/></clipPath><g filter="url(#shadow)"><rect x="40" y="104" width="316" height="250" rx="16" fill="#1f6b3e"/></g><g clip-path="url(#p1)"><rect x="40" y="104" width="316" height="250" rx="16" fill="none" stroke="#134a2a" stroke-width="2"/><path d="M70,314 L150,314 L190,274" stroke="#2a8350" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="200" cy="254" r="40" fill="none" stroke="#e8efe9" stroke-width="3" opacity=".85"/><circle cx="200" cy="254" r="27" fill="url(#tin)" stroke="#7d868f" stroke-width="1.5"/><g filter="url(#shadow)"><path d="M208,246 L278,188 L292,204 Z" fill="url(#iron)" stroke="#4b5563"/><path d="M278,188 L332,142 L350,162 L292,204 Z" fill="#9ca3af" stroke="#4b5563"/><path d="M332,142 L358,118 L378,142 L350,162 Z" fill="#1f2937"/></g><path d="M80,164 C130,164 160,214 186,248" stroke="#c3c9cf" stroke-width="5" fill="none" stroke-linecap="round"/></g><circle cx="64" cy="130" r="14" fill="#ffffff"/><text x="64.0" y="135.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">1</text><text x="40.0" y="386.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Tin the pad</text><text x="40.0" y="408.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">Iron on the pad, feed a little</text><text x="40.0" y="426.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">solder until it is shiny.</text><clipPath id="p2"><rect x="378" y="104" width="316" height="250" rx="16"/></clipPath><g filter="url(#shadow)"><rect x="378" y="104" width="316" height="250" rx="16" fill="#1f6b3e"/></g><g clip-path="url(#p2)"><rect x="378" y="104" width="316" height="250" rx="16" fill="none" stroke="#134a2a" stroke-width="2"/><path d="M408,314 L488,314 L528,274" stroke="#2a8350" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="538" cy="254" r="40" fill="none" stroke="#e8efe9" stroke-width="3" opacity=".85"/><circle cx="538" cy="254" r="27" fill="url(#tin)" stroke="#7d868f" stroke-width="1.5"/><rect x="418" y="185" width="150" height="18" rx="9" fill="#d62828" stroke="#8f1414" stroke-width="2"/><rect x="424" y="188" width="138" height="4" rx="2" fill="#ffffff" opacity=".3"/><rect x="564" y="188.5" width="34" height="11" rx="5" fill="url(#tin)" stroke="#7d868f"/></g><circle cx="402" cy="130" r="14" fill="#ffffff"/><text x="402.0" y="135.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">2</text><text x="378.0" y="386.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Strip and tin the wire</text><text x="378.0" y="408.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">Strip about 2 mm, twist the</text><text x="378.0" y="426.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">strands, coat them in solder.</text><clipPath id="p3"><rect x="716" y="104" width="316" height="250" rx="16"/></clipPath><g filter="url(#shadow)"><rect x="716" y="104" width="316" height="250" rx="16" fill="#1f6b3e"/></g><g clip-path="url(#p3)"><rect x="716" y="104" width="316" height="250" rx="16" fill="none" stroke="#134a2a" stroke-width="2"/><path d="M746,314 L826,314 L866,274" stroke="#2a8350" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="876" cy="254" r="40" fill="none" stroke="#e8efe9" stroke-width="3" opacity=".85"/><circle cx="876" cy="254" r="27" fill="url(#tin)" stroke="#7d868f" stroke-width="1.5"/><rect x="706" y="245" width="120" height="18" rx="9" fill="#d62828" stroke="#8f1414" stroke-width="2"/><rect x="712" y="248" width="108" height="4" rx="2" fill="#ffffff" opacity=".3"/><rect x="822" y="248.5" width="34" height="11" rx="5" fill="url(#tin)" stroke="#7d868f"/><g filter="url(#shadow)"><path d="M890,242 L960,184 L974,200 Z" fill="url(#iron)" stroke="#4b5563"/><path d="M960,184 L1014,138 L1032,158 L974,200 Z" fill="#9ca3af" stroke="#4b5563"/><path d="M1014,138 L1040,114 L1060,138 L1032,158 Z" fill="#1f2937"/></g></g><circle cx="740" cy="130" r="14" fill="#ffffff"/><text x="740.0" y="135.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">3</text><text x="716.0" y="386.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Join</text><text x="716.0" y="408.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">Lay the wire on the pad, touch</text><text x="716.0" y="426.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">the iron for 1–2 s. No extra solder.</text><clipPath id="p4"><rect x="1054" y="104" width="316" height="250" rx="16"/></clipPath><g filter="url(#shadow)"><rect x="1054" y="104" width="316" height="250" rx="16" fill="#1f6b3e"/></g><g clip-path="url(#p4)"><rect x="1054" y="104" width="316" height="250" rx="16" fill="none" stroke="#134a2a" stroke-width="2"/><path d="M1084,314 L1164,314 L1204,274" stroke="#2a8350" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="1214" cy="254" r="40" fill="none" stroke="#e8efe9" stroke-width="3" opacity=".85"/><circle cx="1214" cy="254" r="27" fill="url(#tin)" stroke="#7d868f" stroke-width="1.5"/><rect x="1044" y="245" width="120" height="18" rx="9" fill="#d62828" stroke="#8f1414" stroke-width="2"/><rect x="1050" y="248" width="108" height="4" rx="2" fill="#ffffff" opacity=".3"/><rect x="1160" y="248.5" width="34" height="11" rx="5" fill="url(#tin)" stroke="#7d868f"/><ellipse cx="1212" cy="254" rx="24" ry="20" fill="url(#tin)" stroke="#7d868f"/><rect x="1082" y="232" width="46" height="44" rx="4" fill="#f59e0b" opacity=".55"/><text x="1105.0" y="294.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">Kapton</text></g><circle cx="1078" cy="130" r="14" fill="#ffffff"/><text x="1078.0" y="135.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">4</text><text x="1054.0" y="386.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Check and tape it</text><text x="1054.0" y="408.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">A smooth, shiny cone. Tape the</text><text x="1054.0" y="426.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="start">wire down near the joint.</text><text x="40.0" y="450.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563" text-anchor="start">Illustration. Around 330 °C with leaded solder; keep the iron off chip pins.</text></svg>
