<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" width="1180" height="480" role="img" aria-label="Switched battery feeds the MAX98357A Vin and, optionally through a TPS63020, the ESP32 3V3 pin. The second-button pad goes to GPIO1. GPIO2, 3 and 4 carry I2S to DIN, BCLK and LRC. The MAX98357A drives the speaker."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="24" y="56" width="300" height="120" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,69.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h15v8H3z M18 10.5h2.5v3H18 M6 11v2 M9 11v2 M12 11v2"/></g><text x="71.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">KALLSUP pads</text><text x="40.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Switched battery (measure first)</text><text x="40.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">GND1</text><text x="40.0" y="144.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Second-button pad (measure first)</text><rect x="440" y="56" width="280" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(456.0,69.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="487.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">TPS63020, optional</text><text x="456.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Holds 3.3 V as the battery drains.</text><text x="456.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Without it: battery to the 5V pin</text><rect x="440" y="236" width="280" height="120" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(456.0,249.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="487.0" y="264.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">ESP32-S3-Zero</text><text x="456.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">3V3 (or 5V), GND</text><text x="456.0" y="306.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">GPIO1: button</text><text x="456.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">GPIO2, 3, 4: I2S</text><rect x="856" y="236" width="300" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(872.0,249.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l2.5-6 3.5 12 3-9 2 3h6"/></g><text x="903.0" y="264.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">MAX98357A</text><text x="872.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Vin, GND</text><text x="872.0" y="306.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">DIN, BCLK, LRC</text><text x="872.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">SD and GAIN left open</text><rect x="856" y="56" width="300" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(872.0,69.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g><text x="903.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Speaker</text><text x="872.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Stock 4 Ω 3 W, off P2</text><text x="872.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">red to +, black to −</text><polyline points="332,100 432,100" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="382.0" y="91.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">VIN</text><polyline points="580,160 580,228" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="592.0" y="198.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">OUT to 3V3</text><polyline points="332,152 380,152 380,290 432,290" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="336.0" y="278.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">GPIO1</text><polyline points="728,296 848,296" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="788.0" y="287.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">GPIO2, 3, 4</text><polyline points="1006,228 1006,160" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="1018.0" y="198.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">+ / −</text><polyline points="174,184 174,404 1006,404 1006,364" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="396.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">battery to Vin</text><line x1="24" y1="428" x2="1156" y2="428" stroke="#232a33" stroke-width="1"/><text x="24.0" y="454.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Every GND pin joins GND1. Measure the two marked pads before soldering: docs/build-guide.md.</text></svg>
