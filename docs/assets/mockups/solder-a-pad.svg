<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" role="img" aria-label="Four close-ups of soldering a wire to a test pad: tin the pad, strip and tin the wire, lay it on the pad and touch the iron for one to two seconds, then check for a smooth shiny joint and tape the wire down."><defs><linearGradient id="esp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a58bf"/><stop offset="1" stop-color="#1d438f"/></linearGradient><linearGradient id="ada" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6ad6"/><stop offset="1" stop-color="#2150a8"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#b9c0c8"/><stop offset="1" stop-color="#e6e9ec"/></linearGradient><radialGradient id="gold" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fbe7a1"/><stop offset=".6" stop-color="#d4a73a"/><stop offset="1" stop-color="#9c7418"/></radialGradient><radialGradient id="tin" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d7dce1"/><stop offset="1" stop-color="#7d868f"/></radialGradient><radialGradient id="cone" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#50565e"/><stop offset=".75" stop-color="#2d3238"/><stop offset="1" stop-color="#1c1f23"/></radialGradient><linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7280"/><stop offset=".45" stop-color="#e5e7eb"/><stop offset="1" stop-color="#4b5563"/></linearGradient><linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3b27a"/><stop offset=".5" stop-color="#c46a2c"/><stop offset="1" stop-color="#e89a5c"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".28"/></filter></defs><rect width="1400" height="470" rx="18" fill="#dfe4ea"/><line x1="40" y1="0" x2="